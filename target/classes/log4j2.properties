status = warn

# =====================================================================
# 1. \u0410\u041F\u041F\u0415\u041D\u0414\u0415\u0420 \u0414\u041B\u042F \u0412\u0410\u0428\u0418\u0425 \u041B\u041E\u0413\u041E\u0412 (\u0412 \u041A\u041E\u041D\u0421\u041E\u041B\u042C) \u2014 \u0426\u0412\u0415\u0422\u0410 \u0421\u0420\u0410\u0411\u041E\u0422\u0410\u042E\u0422 \u0422\u0423\u0422
# =====================================================================
appender.myConsole.type = Console
appender.myConsole.name = MyColoredConsole
appender.myConsole.layout.type = PatternLayout
# \u041F\u0435\u0440\u0435\u043D\u0435\u0441\u043B\u0438 \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0443\u044E \u043F\u043E\u0434\u0441\u0432\u0435\u0442\u043A\u0443 \u0441\u044E\u0434\u0430. \u0412 \u043A\u043E\u043D\u0441\u043E\u043B\u0438 ERROR \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u043E \u0441\u0442\u0430\u043D\u0435\u0442 \u043A\u0440\u0430\u0441\u043D\u044B\u043C
appender.myConsole.layout.pattern = %style{%d{yyyy-MM-dd HH:mm:ss}}{white} [%style{%t}{blue}] %highlight{%-5level}{ERROR=red, FATAL=red, WARN=yellow, INFO=green} %style{%logger{36}}{cyan} - %msg%n%ex{2}

# =====================================================================
# 2. \u0410\u041F\u041F\u0415\u041D\u0414\u0415\u0420 \u0414\u041B\u042F \u0412\u0410\u0428\u0418\u0425 \u041B\u041E\u0413\u041E\u0412 (\u0412 \u0424\u0410\u0419\u041B) \u2014 \u0411\u0415\u0417 \u0426\u0412\u0415\u0422\u041E\u0412\u041E\u0413\u041E \u041C\u0423\u0421\u041E\u0420\u0410
# =====================================================================
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = ${sys:my.project.root}/logs/app.log
appender.file.append = false
appender.file.layout.type = PatternLayout
# \u041F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E \u043E\u0447\u0438\u0441\u0442\u0438\u043B\u0438 \u043E\u0442 %style \u0438 %highlight, \u0447\u0442\u043E\u0431\u044B \u0432 \u0444\u0430\u0439\u043B\u0435 \u043D\u0435 \u0431\u044B\u043B\u043E \u0441\u0438\u043C\u0432\u043E\u043B\u043E\u0432 ESC
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n%ex{2}%n
# =====================================================================
# 3. \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0410 \u0412\u0410\u0428\u0418\u0425 \u041B\u041E\u0413\u041E\u0412 (org.example)
# =====================================================================
loggers = myAppLogger

logger.myAppLogger.name = org.example
logger.myAppLogger.level = info
logger.myAppLogger.appenderRefs = myConsoleRef, fileRef
logger.myAppLogger.appenderRef.myConsoleRef.ref = MyColoredConsole
logger.myAppLogger.appenderRef.fileRef.ref = FileAppender
logger.myAppLogger.additivity = false

# =====================================================================
# 4. \u041E\u0422\u041A\u041B\u042E\u0427\u0415\u041D\u0418\u0415 \u0427\u0423\u0416\u0418\u0425 \u041B\u041E\u0413\u041E\u0412 (Root Logger)
# =====================================================================
rootLogger.level = off
